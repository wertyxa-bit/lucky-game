<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Upgrade PRO</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #2d2d2d;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        h1 { 
            color: #ffd700; 
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        
        .balance-box {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #333, #222);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 2px solid #444;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .gold-text { color: #ffd700; }

        /* Полоска прогресса */
        .progress-container {
            width: 100%;
            height: 24px;
            background: #444;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4b4b, #f1c40f, #2ecc71);
            transition: width 0.05s linear;
            position: absolute;
            top: 0; left: 0;
        }

        button {
            background: linear-gradient(to right, #ffd700, #ffb700);
            color: black;
            border: none;
            padding: 16px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.96); }
        button:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
            filter: grayscale(1);
        }

        .result-msg {
            margin-top: 20px;
            font-size: 20px;
            min-height: 30px;
            font-weight: bold;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        
        .win { color: #2ecc71; text-shadow: 0 0 10px rgba(46, 204, 113, 0.5); }
        .lose { color: #e74c3c; text-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LUCKY UPGRADE</h1>
    <div class="subtitle">Испытай свою удачу!</div>
    
    <div class="balance-box">
        Баланс: <span id="balance-display" class="gold-text">20,000</span> G
    </div>

    <!-- Анимированная полоска -->
    <div class="progress-container">
        <div class="progress-bar" id="bar"></div>
    </div>

    <button id="upgrade-btn" onclick="startUpgrade()">АПГРЕЙД (+50G)</button>
    
    <div class="result-msg" id="message"></div>

    <div class="stats-row">
        <span>Шанс x2: 46%</span>
        <span>Шанс x3: 30%</span>
        <span>Fail: 24%</span>
    </div>
</div>

<script>
    // 1. Загрузка баланса из памяти браузера
    let balance = localStorage.getItem('lucky_balance_v2');
    if (!balance) {
        balance = 20000; // Стартовый капитал
        localStorage.setItem('lucky_balance_v2', balance);
    } else {
        balance = parseInt(balance);
    }

    const balanceDisplay = document.getElementById('balance-display');
    const bar = document.getElementById('bar');
    const btn = document.getElementById('upgrade-btn');
    const msg = document.getElementById('message');

    // Форматируем число с запятыми
    function formatNumber(num) {
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // Показываем начальный баланс
    balanceDisplay.innerText = formatNumber(balance);

    function saveBalance(newBal) {
        balance = newBal;
        localStorage.setItem('lucky_balance_v2', balance);
        balanceDisplay.innerText = formatNumber(balance);
    }

    function startUpgrade() {
        const betAmount = 50;
        
        if (balance < betAmount) {
            msg.innerHTML = '<span class="lose">Недостаточно средств!</span>';
            return;
        }

        // Блокируем кнопку
        btn.disabled = true;
        msg.innerHTML = '';
        bar.style.width = '0%';

        // Логика шансов
        // x2 - 46%, x3 - 30%, fail - 24%
        const roll = Math.random() * 100;
        let multiplier = 0;
        let targetPosition = 0; 

        if (roll <= 46) {
            multiplier = 2;
            targetPosition = 20 + Math.random() * 10; 
        } else if (roll <= 76) { 
            multiplier = 3;
            targetPosition = 40 + Math.random() * 10; 
        } else {
            multiplier = 0; 
            targetPosition = 85 + Math.random() * 10; 
        }

        // Анимация полоски
        let progress = 0;
        const duration = 2000; 
        const intervalTime = 30;
        const steps = duration / intervalTime;
        const stepSize = 100 / steps;

        const interval = setInterval(() => {
            progress += stepSize;
            
            if(progress > 80) {
                 progress -= (stepSize * 0.5); 
            }

            if (progress >= 100 || progress >= targetPosition) {
                clearInterval(interval);
                finishGame(multiplier, betAmount, targetPosition);
            } else {
                bar.style.width = progress + '%';
            }
        }, intervalTime);
    }

    function finishGame(mult, bet, finalPos) {
        btn.disabled = false;
        bar.style.width = finalPos + '%'; 
        
        if (mult === 0) {
            // ПРОИГРЫШ
            saveBalance(balance - bet);
            msg.innerHTML = `<span class="lose">💀 ПРОВАЛ! -${bet} G</span>`;
            bar.style.background = '#e74c3c'; 
        } else {
            // ВЫИГРЫШ
            const winAmount = bet * mult;
            saveBalance(balance - bet + winAmount);
            msg.innerHTML = `<span class="win">✅ УСПЕХ! +${winAmount} G (x${mult})</span>`;
            bar.style.background = '#2ecc71'; 
            
            createConfetti();
        }

        setTimeout(() => {
             bar.style.background = 'linear-gradient(90deg, #ff4b4b, #f1c40f, #2ecc71)';
        }, 1500);
    }

    // Простая функция конфетти
    function createConfetti() {
        for(let i=0; i<30; i++) {
            const confetti = document.createElement('div');
            confetti.style.position = 'absolute';
            confetti.style.left = '50%';
            confetti.style.top = '50%';
            confetti.style.width = '8px';
            confetti.style.height = '8px';
            confetti.style.backgroundColor = ['#ffd700', '#ff4b4b', '#2ecc71'][Math.floor(Math.random()*3)];
            confetti.style.borderRadius = '50%';
            confetti.style.pointerEvents = 'none';
            confetti.style.zIndex = '100';
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = 5 + Math.random() * 10;
            const vx = Math.cos(angle) * velocity;
            const vy = Math.sin(angle) * velocity;
            
            document.body.appendChild(confetti);
            
            let posX = window.innerWidth/2;
            let posY = window.innerHeight/2;
            let velX = vx;
            let velY = vy;
            
            const anim = setInterval(() => {
                posX += velX;
                posY += velY;
                velY += 0.5; 
                
                confetti.style.left = posX + 'px';
                confetti.style.top = posY + 'px';
                
                if(posY > window.innerHeight) {
                    clearInterval(anim);
                    confetti.remove();
                }
            }, 20);
        }
    }
</script>

</body>
</html>
